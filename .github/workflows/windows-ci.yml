name: Windows CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress
      - name: Install project
        shell: powershell
        run: python -m pip install -e ".[dev]"
      - name: Lint
        shell: powershell
        run: |
          ruff check .
          ruff format --check .
      - name: Test native Windows pipeline
        id: pytest
        shell: powershell
        continue-on-error: true
        run: |
          pytest -q --tb=long 2>&1 | Tee-Object -FilePath pytest-windows.log
          "exit_code=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pytest-log
          path: pytest-windows.log
          if-no-files-found: error
      - name: Fail when Windows tests fail
        if: steps.pytest.outputs.exit_code != '0'
        shell: powershell
        run: exit 1
