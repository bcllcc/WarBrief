name: Windows CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress
      - name: Install project
        shell: powershell
        run: python -m pip install -e ".[dev]"
      - name: Lint
        shell: powershell
        run: |
          ruff check .
          ruff format --check .
      - name: Test native Windows pipeline
        shell: powershell
        run: pytest -q
