[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warbrief"
version = "0.1.0"
description = "AI military news-to-short-video factory demo"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "WarBrief Contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "Pillow>=10,<13",
  "python-multipart>=0.0.9,<1",
  "edge-tts>=7.2,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
warbrief = "warbrief.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["warbrief*"]

[tool.setuptools.package-data]
warbrief = ["web/*", "sample_data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
